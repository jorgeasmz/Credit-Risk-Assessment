name: Release

on:
  # A change to how the model is built or to what it is built from.
  push:
    branches: [main]
    paths:
      - "model/**"
      - "requirements.txt"
      # Excluded, or pinning a promoted version would trigger the run that pins it.
      - "!model/production.json"
  workflow_dispatch:

# Only one release at a time: two runs would publish two artifacts and race the
# gate over which of them is the incumbent.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - run: pip install -r requirements-train.txt

      - name: Fit the candidate
        run: python -m model.train

      # Publishing before the gate is deliberate. The gate compares a candidate
      # that exists, and a version refused by it stays in the registry with the
      # score that refused it, which is the record of what was tried.
      - name: Measure and publish
        run: python -m model.release --publish

      # A candidate that does not improve on production is an ordinary outcome and
      # not a failure, so the step records its verdict instead of ending the run.
      # What the gate withholds is the pointer, and without the pointer there is no
      # commit and therefore no deployment.
      - name: Gate
        id: gate
        continue-on-error: true
        run: |
          read -r VALUE DATASET REVISION < <(python - <<'PY'
          import json
          record = json.load(open("model/release.json"))
          print(record["value"], record["dataset"], record["revision"])
          PY
          )
          python -m registry.promote --model credit-risk \
            --value "$VALUE" --dataset "$DATASET" --revision "$REVISION" \
            --commit "$GITHUB_SHA" --apply

      - name: Pin the promoted version
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m registry.resolve --model credit-risk --describe > model/production.json
          if git diff --quiet -- model/production.json; then
            echo "The version in production is the one already pinned." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="promote/credit-risk-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add model/production.json
          git commit -m "chore: Pin credit-risk to the promoted version"
          git push -u origin "$BRANCH"

          # A pull request rather than a push to main: the branch is protected, and
          # the diff is the whole of the deployment, which is a thing worth reading.
          gh pr create \
            --title "Promote credit-risk to version $(python -c "import json;print(json.load(open('model/production.json'))['version'])")" \
            --body "$(python - <<'PY'
          import json
          pin = json.load(open("model/production.json"))
          print(f"The gate promoted version {pin['version']}.\n")
          print(f"| | |\n|---|---|")
          print(f"| Metric | {pin['metric']} {pin['value']} |")
          print(f"| Held-out data | `{pin['dataset']}` |")
          print(f"| Artifact | [`{pin['revision'][:12]}`]({pin['url']}) |")
          print("\nMerging this deploys it. The image downloads the pinned commit "
                "rather than fitting a model of its own.")
          PY
          )"

      - name: Report a held candidate
        if: steps.gate.outcome == 'failure'
        run: |
          echo "The candidate did not replace the version in production, so nothing" \
            "was pinned and nothing will deploy." >> "$GITHUB_STEP_SUMMARY"
