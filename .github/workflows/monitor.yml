name: Monitor

on:
  schedule:
    - cron: "10 8 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - run: pip install -r requirements-train.txt

      # The reference is the training split scored by the model that is serving,
      # so the comparison is against what production actually decides with rather
      # than against whatever a fresh fit would produce.
      - name: Fetch the model in production
        run: python -m model.fetch

      # A non-zero exit fails the job, and a failing scheduled run is the
      # notification. Reporting drift into a summary nobody opens is not one.
      - name: Compare the decision log against the training split
        run: python -m model.monitor
