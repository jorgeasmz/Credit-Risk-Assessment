name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: credit
          POSTGRES_PASSWORD: credit
          POSTGRES_DB: credit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      # The suite runs on SQLite for speed. This proves the same migrations
      # also apply to the engine the service actually deploys against, which is
      # where dialect differences would otherwise surface in production.
      - name: Apply migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://credit:credit@localhost:5432/credit
        run: alembic upgrade head
