# Render Blueprint: the API and its database, as code rather than dashboard
# clicks. Apply with Render > Blueprints > New Blueprint Instance.
databases:
  - name: credit-risk-db
    plan: free

services:
  - type: web
    name: credit-risk-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: credit-risk-db
          property: connectionString
      # Generated once by Render and never committed. Copy it into the
      # Streamlit Cloud secrets so the front end can authenticate.
      - key: API_KEY
        generateValue: true
